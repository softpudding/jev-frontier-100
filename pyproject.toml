[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-frontier-100"
version = "0.2.0"
description = "A small reproducible closed-answer capability frontier probe for Jev and thinking language models"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
